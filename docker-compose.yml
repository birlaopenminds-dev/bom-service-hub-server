version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16.4-alpine
    container_name: ${ENV_PREFIX:-uat}_bom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bom_service_hub_uat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bom_service_hub_uat}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - server_internal

  # ==========================================
  # NestJS Backend API Service
  # ==========================================
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX:-uat}_bom_server
    restart: unless-stopped
    ports:
      - "${SERVER_HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      API_PREFIX: api
      API_VERSION: 1
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_uploads:/app/public/uploads
    networks:
      - server_internal

volumes:
  postgres_data:
    name: ${ENV_PREFIX:-uat}_postgres_data
  server_uploads:
    name: ${ENV_PREFIX:-uat}_server_uploads

networks:
  server_internal:
    driver: bridge
