version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ${ENV_PREFIX}_bom_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - server_internal

  # ==========================================
  # NestJS Backend API Service
  # ==========================================
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}_bom_server
    restart: always
    ports:
      - "${SERVER_HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5000
      API_PREFIX: api
      API_VERSION: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_uploads:/app/public/uploads
    networks:
      - server_internal

volumes:
  postgres_data:
    name: ${ENV_PREFIX}_postgres_data
  server_uploads:
    name: ${ENV_PREFIX}_server_uploads

networks:
  server_internal:
    driver: bridge
