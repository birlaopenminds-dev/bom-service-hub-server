version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ${ENV_PREFIX}_bom_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - server_internal
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # NestJS Backend API Service (Traefik Enabled)
  # ==========================================
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}_bom_server
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5000
      API_PREFIX: api
      API_VERSION: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_uploads:/app/public/uploads
    networks:
      - server_internal
      - traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Traefik Router & Service for Server (Scoped with ENV_PREFIX)
      - "traefik.http.routers.${ENV_PREFIX}_bom_server.rule=Host(`${API_DOMAIN_NAME}`) || (Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`))"
      - "traefik.http.routers.${ENV_PREFIX}_bom_server.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${ENV_PREFIX}_bom_server.tls=true"
      - "traefik.http.routers.${ENV_PREFIX}_bom_server.tls.certresolver=${LETSENCRYPT_RESOLVER}"
      - "traefik.http.services.${ENV_PREFIX}_bom_server.loadbalancer.server.port=5000"

volumes:
  postgres_data:
    name: ${ENV_PREFIX}_postgres_data
  server_uploads:
    name: ${ENV_PREFIX}_server_uploads

networks:
  server_internal:
    driver: bridge
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK}
